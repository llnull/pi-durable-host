<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Durable Host</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f6fa; --paper: #fff; --ink: #1a2233; --soft: #4a5568; --faint: #8a94a6;
    --accent: #4f46e5; --accent-soft: #eef0fe; --line: #e3e7ef;
    --green: #0f7b4f; --green-bg: #e8f6ee; --red: #b3261e; --red-bg: #fdeceb;
    --amber: #92600a; --amber-bg: #fdf3e0; --mono: ui-monospace, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /* 应用式布局：body 不滚动（100dvh 弹性视口），header/工具栏固定顶部、composer 固定底部，#transcript 内部滚动 */
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow-wrap: break-word; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; flex: none;
    padding: 10px max(var(--pad-x), calc((100% - var(--shell-max)) / 2 + var(--pad-x)));
    background: #1e1b4b; color: #eef0ff;
  }
  /* 专注模式下 header 也对齐到阅读列轴线 */
  body.layout-focus header.top { padding-left: max(var(--pad-x), calc((100% - var(--focus-max)) / 2 + var(--pad-x))); padding-right: max(var(--pad-x), calc((100% - var(--focus-max)) / 2 + var(--pad-x))); }
  header.top h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; }
  .badge { border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; }
  .badge.busy { background: var(--amber-bg); color: var(--amber); }
  .badge.idle { background: var(--green-bg); color: var(--green); }
  .badge.dim { background: rgba(255,255,255,.14); color: #dfe2ff; font-weight: 400; }
  header.top .spacer { flex: 1; }
  header.top button {
    background: rgba(255,255,255,.12); color: #eef0ff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; padding: 4px 12px; font-size: 12.5px; cursor: pointer;
  }
  header.top select {
    background: rgba(255,255,255,.12); color: #eef0ff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; padding: 4px 8px; font-size: 12.5px; max-width: 160px; cursor: pointer;
  }
  header.top select option { color: #1a2233; }
  header.top button:hover { background: rgba(255,255,255,.22); }
  #approvalBody .kv { margin: 8px 0; }
  #approvalBody pre.code { margin: 4px 0; }
  #approvalBody .mini { border: 1px solid var(--line); background: var(--paper); color: var(--soft); border-radius: 8px; padding: 3px 10px; font-size: 12px; cursor: pointer; margin-right: 6px; }
  #approvalBody .mini.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #approvalBody .mini.danger { color: var(--red); border-color: #f2c4c0; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: none;
    width: 100%; max-width: var(--shell-max); margin: 0 auto; padding: 12px var(--pad-x) 8px;
    background: var(--bg);
  }
  .toolbar input[type=search] {
    flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 12px; font: inherit; background: var(--paper); outline-color: var(--accent);
  }
  .toolbar .chip {
    border: 1px solid var(--line); background: var(--paper); color: var(--soft);
    border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; user-select: none;
  }
  .toolbar .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar .mini { border: 1px solid var(--line); background: var(--paper); color: var(--soft); border-radius: 9px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }

  /* --shell-max：内容壳宽度档位（宽屏逐级放宽）；专注模式（body.layout-focus）收起侧栏并收窄为阅读列宽 */
  :root { --shell-max: 1200px; --focus-max: 1000px; --pad-x: 14px; }
  @media (min-width: 1440px) { :root { --shell-max: 1440px; } }
  @media (min-width: 1920px) { :root { --shell-max: 1600px; } }
  /* minmax(0,1fr)：断开 min-content 向轨道上传，防止长代码行/表格把整页撑宽；flex:1 占满剩余高度 */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 14px; width: 100%; max-width: var(--shell-max); margin: 6px auto 0; padding: 0 var(--pad-x) 14px; flex: 1; min-height: 0; }
  @media (max-width: 900px) { .layout { display: flex; flex-direction: column; } #transcript { flex: 1; min-height: 0; } .side { flex: none; max-height: 38%; } }
  @media (max-width: 560px) { :root { --pad-x: 10px; } .layout { padding: 0 var(--pad-x) 10px; } .run-stats { display: none; } .msg .bubble { max-width: 94%; } }
  /* 专注模式：侧栏收起，主列收窄为阅读列宽并居中 */
  body.layout-focus .layout { grid-template-columns: minmax(0, 1fr); max-width: var(--focus-max); }
  body.layout-focus .toolbar { max-width: var(--focus-max); }
  body.layout-focus .side { display: none; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; max-width: 100%; }
  #transcript { overflow-y: auto; scrollbar-gutter: stable; min-height: 0; padding-bottom: 18px; }
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; overflow-y: auto; }
  .side .panel { overflow: hidden; }
  .panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--faint); font-weight: 600; letter-spacing: .06em; }

  /* ===== run 分组 ===== */
  .run { border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; background: var(--paper); overflow: hidden; }
  .run-head {
    display: flex; align-items: baseline; gap: 8px; padding: 9px 14px; cursor: pointer;
    background: #fafbfe; border-bottom: 1px solid transparent; user-select: none;
  }
  .run.open .run-head { border-bottom-color: var(--line); }
  .run-head:hover { background: var(--accent-soft); }
  .run-no { font: 12px var(--mono); color: var(--faint); }
  .run-tag { font-size: 11.5px; font-weight: 700; border-radius: 5px; padding: 0 7px; }
  .run-tag.new { color: #0b5aa5; background: #e8f1fd; }
  .run-tag.steer { color: var(--amber); background: var(--amber-bg); }
  .run-preview { flex: 1; min-width: 0; font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run-preview b { color: var(--ink); font-weight: 600; }
  .run-stats { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .run-caret { color: var(--faint); font-size: 11px; }
  .run-body { padding: 6px 14px 10px; }
  .epoch { text-align: center; color: var(--faint); font-size: 12px; margin: 18px 0 4px; display: flex; align-items: center; gap: 10px; }
  .epoch::before, .epoch::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }

  /* ===== 气泡 ===== */
  .msg { display: flex; margin: 8px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 86%; border-radius: 12px; padding: 8px 13px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .msg.agent .bubble { max-width: 100%; }
  /* 超宽下散文限宽保可读性；表格/代码块仍用满气泡宽度 */
  .bubble .md p { max-width: 88ch; }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .fork-btn { visibility: hidden; align-self: flex-end; margin: 0 6px 2px; border: none; background: none; color: var(--faint); font-size: 13px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .msg.user:hover .fork-btn { visibility: visible; }
  .fork-btn:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .msg.agent .bubble { background: #f4f5fa; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.stream .bubble { border-style: dashed; }
  .bubble .e-body + .e-body, .bubble details + .e-body, .e-body + details { margin-top: 6px; }
  .e-body.thinking { color: var(--faint); font-size: 13px; }
  .quoted { border-left: 3px solid var(--line); padding-left: 10px; color: var(--soft); }
  /* ===== markdown 渲染 ===== */
  .md { white-space: normal; }
  .md p { margin: 3px 0; }
  .md h1.md-h, .md h2.md-h { font-size: 1.2em; margin: 10px 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .md h3.md-h, .md h4.md-h { font-size: 1.08em; margin: 8px 0 3px; }
  .md h5.md-h, .md h6.md-h { font-size: 1em; margin: 6px 0 2px; }
  .md .md-list { margin: 4px 0; padding-left: 22px; }
  .md .md-list li { margin: 2px 0; }
  .md .md-q { margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--accent-line); color: var(--soft); background: #fafbfe; border-radius: 0 6px 6px 0; }
  .md .md-inline { font-family: var(--mono); font-size: .88em; background: #eef0f6; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .md table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 3px 9px; }
  .md th { background: #f0f2f8; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
  .md a { color: var(--accent); }
  details summary { cursor: pointer; color: var(--faint); font-size: 12.5px; user-select: none; }
  pre.code { background: #14181f; color: #d8e0f0; border-radius: 8px; padding: 8px 12px; overflow-x: auto; max-width: 100%; font: 12px/1.6 var(--mono); margin: 4px 0; }
  .muted { color: var(--faint); font-size: 12.5px; }

  /* ===== 工具卡片（call + result 配对）===== */
  .tool-card { border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; background: #fff; overflow: hidden; }
  .tool-card .tc-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer;
    font: 12.5px var(--mono); color: var(--soft); background: #fafbfe; user-select: none;
  }
  .tool-card .tc-head:hover { background: var(--accent-soft); }
  .tool-card .tc-name { font-weight: 700; color: var(--accent); }
  .tool-card.err .tc-status { color: var(--red); }
  .tool-card.ok .tc-status { color: var(--green); }
  .tool-card.running .tc-status { color: var(--amber); }
  .tool-card .tc-body { border-top: 1px solid var(--line); padding: 6px 12px; }
  .syschip { font-size: 12px; color: var(--faint); margin: 6px 0; }

  .kv { font-size: 12.5px; color: var(--soft); margin: 2px 0; overflow-wrap: anywhere; }
  .kv b { color: var(--ink); font-weight: 600; }
  .live-block { border: 1px dashed var(--accent-line); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; background: #fbfcff; }
  .live-block .t { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 3px; }

  .composer { flex: none; background: var(--bg); border-top: 1px solid var(--line); padding: 10px var(--pad-x) 12px; }
  /* 输入框与内容列同轴：左边缘 = 聊天主列左边缘，宽度 = 主列宽（shell − 2×pad − 300 侧栏 − 14 间距） */
  .composer .inner {
    position: relative;
    margin-left: max(var(--pad-x), calc((100% - var(--shell-max)) / 2 + var(--pad-x)));
    width: calc(min(100%, var(--shell-max)) - var(--pad-x) * 2 - 314px); margin-right: auto; background: var(--paper);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 18px rgba(26,34,51,.08);
    padding: 8px 12px; transition: border-color .15s, box-shadow .15s;
  }
  @media (min-width: 901px) {
    body.layout-focus .composer .inner {
      margin-left: max(var(--pad-x), calc((100% - var(--focus-max)) / 2 + var(--pad-x)));
      width: calc(min(100%, var(--focus-max)) - var(--pad-x) * 2);
    }
  }
  @media (max-width: 900px) { .composer .inner { margin: 0 var(--pad-x); width: auto; } }
  .composer .inner:focus-within { border-color: var(--accent); box-shadow: 0 6px 22px rgba(79,70,229,.16); }
  .composer textarea {
    display: block; width: 100%; resize: none; border: none; outline: none; background: transparent;
    padding: 4px 6px; font: inherit; min-height: 44px; max-height: 180px; color: var(--ink);
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .composer .hint { flex: 1; min-width: 0; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .composer .count { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  /* 快捷操作弹层：/ 命令面板 + @ 文件补全（issue #35） */
  .composer .palette {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
    max-height: 260px; overflow: auto; overscroll-behavior: contain;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 -10px 28px rgba(0,0,0,.14); z-index: 40; padding: 4px;
  }
  .palette .pi-item { display: flex; align-items: baseline; gap: 10px; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .palette .pi-item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .palette .pi-item .t { flex: none; font-weight: 600; }
  .palette .pi-item .d { flex: 1; min-width: 0; color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 9px; }
  .state .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .state.idle { color: var(--green); background: var(--green-bg); }
  .state.busy { color: var(--amber); background: var(--amber-bg); }
  .state.busy .dot { animation: cstate-pulse 1.2s ease-in-out infinite; }
  @keyframes cstate-pulse { 50% { opacity: .2; } }
  .cbtn {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    border: 1px solid transparent; border-radius: 10px; padding: 7px 14px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .12s, border-color .12s, box-shadow .12s, transform .06s;
  }
  .cbtn:active:not(:disabled) { transform: translateY(1px); }
  .cbtn:disabled { opacity: .45; cursor: not-allowed; }
  .cbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cbtn svg { width: 15px; height: 15px; flex: none; }
  .cbtn.primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(79,70,229,.35); }
  .cbtn.primary:hover:not(:disabled) { background: #4338ca; }
  .cbtn.secondary { background: #eaf2fd; color: #0b5aa5; border-color: #cfe0f7; }
  .cbtn.secondary:hover:not(:disabled) { background: #dbeafe; }
  .cbtn.danger { background: transparent; color: var(--red); border-color: var(--line); }
  .cbtn.danger:hover:not(:disabled) { background: var(--red-bg); border-color: #f2c4c0; }
  @media (max-width: 640px) {
    .cbtn .lbl { display: none; }
    .cbtn { padding: 7px 10px; }
    .composer .hint { display: none; }
    .state { display: none; }
  }
  .toast { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); background: var(--red-bg); color: var(--red); border: 1px solid #f2c4c0; border-radius: 10px; padding: 8px 16px; font-size: 13px; z-index: 99; display: none; }
  #conn { font-size: 12px; }
  .filelink { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  .filelink:hover { background: var(--accent-soft); }
  #filesBody .kv { margin: 3px 0; }
  /* 侧栏动态内容面板限高，超出部分内部滚动，避免把其它面板挤到页尾 */
  #liveBody, #inboxBody, #filesBody { max-height: 38vh; overflow-y: auto; }
</style>
</head>
<body>
<header class="top">
  <h1>Pi Durable Host</h1>
  <span id="status" class="badge idle">空闲</span>
  <select id="sessionSel" title="会话（每个会话一个持久 conversation）"></select>
  <button id="btnNewSession" title="新建会话">＋</button>
  <button id="btnDelSession" title="删除当前会话（default 除外）">🗑</button>
  <select id="modelSel" title="模型"></select>
  <span id="cwd" class="badge dim"></span>
  <span class="spacer"></span>
  <span id="conn" class="badge dim">连接中…</span>
  <button id="btnBackup" title="VACUUM INTO 快照到 data/backups/">备份</button>
  <button id="btnRestart" title="热重启 daemon（运行中的 run 由新进程 resume）">重启</button>
  <button id="btnTasks">任务图</button>
  <button id="btnFiles" title="浏览 agent 工作区文件（点击在新窗口打开）">文件</button>
  <button id="btnCompact">压缩</button>
  <button id="btnReset">重置上下文</button>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="搜索对话内容…（过滤轮次并自动展开）">
  <span class="chip on" data-filter="all">全部</span>
  <span class="chip" data-filter="tools">含工具调用</span>
  <span class="chip" data-filter="steer">转向</span>
  <button class="mini" id="btnExpand">全部展开</button>
  <button class="mini" id="btnCollapse">全部收起</button>
  <button class="mini" id="btnBottom">跳到最新 ↓</button>
  <button class="chip" id="chipFocus" title="专注模式：收起侧栏，收窄为阅读列宽（再次点击恢复）">专注</button>
</div>

<div class="layout">
  <main class="panel" id="transcript"><div class="muted">（加载中…）</div></main>
  <aside class="side">
    <div class="panel" id="livePanel" style="display:none">
      <h3>实时运行</h3><div id="liveBody"></div>
    </div>
    <div class="panel" id="inboxPanel" style="display:none">
      <h3>排队中</h3><div id="inboxBody"></div>
    </div>
    <div class="panel" id="approvalPanel" style="display:none">
      <h3>审批（host-guard）</h3><div id="approvalBody"></div>
    </div>
    <div class="panel">
      <h3>用量与会话</h3><div id="usageBody" class="muted">…</div>
    </div>
    <div class="panel" id="tasksPanel" style="display:none">
      <h3>任务图</h3><div id="tasksBody"></div>
    </div>
    <div class="panel" id="filesPanel" style="display:none">
      <h3>工作区文件</h3><div id="filesBody"></div>
    </div>
  </aside>
</div>

<div class="composer">
  <div class="inner">
    <div id="palette" class="palette" hidden></div>
    <textarea id="input" placeholder="输入指令…（/ 命令 · @ 文件 · Enter 发送，Shift+Enter 换行）"></textarea>
    <div class="row">
      <span id="cstate" class="state idle" title="agent 当前状态"><span class="dot"></span><span id="cstateText">空闲</span></span>
      <span class="hint">Enter 发送 · Shift+Enter 换行 · Ctrl+Enter 发送 · 空输入按 ↑ 召回上一条 · 忙时发送自动排队，转向并入当前运行</span>
      <span class="count" id="charCount"></span>
      <button id="btnAbort" class="cbtn danger" title="中止当前运行（后台任务不受影响）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="lbl">中止</span>
      </button>
      <button id="btnSteer" class="cbtn secondary" title="插入当前工具轮之后，并入正在运行的工作">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg><span class="lbl">转向</span>
      </button>
      <button id="btnSend" class="cbtn primary" title="发送（忙时自动排队为 follow-up）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg><span class="lbl" id="btnSendLabel">发送</span>
      </button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- 工作区文件链接：把聊天里出现的文件路径变成可点击链接（新窗口打开） ----------
const FILE_EXT = "html?|htm|css|js|mjs|cjs|json|txt|md|markdown|csv|tsv|log|xml|ya?ml|toml|ini|png|jpe?g|gif|svg|webp|ico|bmp|pdf|mp4|webm|mov|mp3|wav|ogg|wasm|zip|taz?|gz";
const FILE_RE = new RegExp("(?<![A-Za-z0-9_./()-:])([A-Za-z0-9_./-]*[A-Za-z0-9_-][.](?:" + FILE_EXT + "))(?![A-Za-z0-9_./-])", "gi");
function toFileHref(raw) {
  let rel = String(raw);
  while (rel.startsWith("./")) rel = rel.slice(2);
  if (rel.toLowerCase().startsWith("workspace/")) rel = rel.slice(10);
  if (rel.startsWith("/")) rel = rel.slice(1);
  return "/files/" + encodeURI(rel);
}
function linkifyFiles(escapedText) {
  return String(escapedText ?? "").replace(FILE_RE, (m) => `<a class="filelink" href="${toFileHref(m)}" target="_blank" rel="noopener noreferrer" title="在新窗口打开">${m}</a>`);
}
// ---------- 状态 ----------
const expanded = new Set();   // 展开的 run 的首条 entry id
let filterMode = "all";
let hasRendered = false;
let followBottom = true;      // 视图跟随：内容更新时自动滚到最新（用户上翻阅读时自动关闭）

function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => (t.style.display = "none"), 4000); }
async function api(path, opts) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

// ---------- 轻量 markdown 渲染（先转义再转换，防 XSS；自包含无依赖） ----------
function inlineMd(s) {
  return linkifyFiles(s)
    .replace(/`([^`]+)`/g, '<code class="md-inline">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function mdToHtml(src) {
  const raw = String(src ?? "");
  if (!raw.trim()) return "";
  const codeBlocks = [];
  // 围栏代码块先摘出（未闭合的也按代码处理，兼容流式半截输出）
  const text = raw.replace(/\r\n/g, "\n").replace(/```[^\n`]*\n([\s\S]*?)(?:```|$)/g, (m, code) => {
    codeBlocks.push(`<pre class="code">${esc(code.replace(/\n$/, ""))}</pre>`);
    return `\u0000CODE${codeBlocks.length - 1}\u0000`;
  });
  const lines = esc(text).split("\n"); // 其余文本先转义，后续变换都在安全文本上做
  const out = [];
  let list = null;
  let para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${inlineMd(para.join("<br>"))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const flushAll = () => { flushPara(); flushList(); };
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    const ph = t.match(/^\u0000CODE(\d+)\u0000$/);
    if (ph) { flushAll(); out.push(codeBlocks[+ph[1]]); continue; }
    if (!t) { flushAll(); continue; }
    // 表格：当前行以 | 开头且下一行是分隔行
    if (t.startsWith("|") && i + 1 < lines.length && /\|?[\s:|-]+\|?/.test(lines[i + 1]) && lines[i + 1].includes("-") && !lines[i + 1].match(/[\w\u4e00-\u9fa5]/)) {
      flushAll();
      const rows = [];
      let j = i;
      while (j < lines.length && lines[j].trim().startsWith("|")) { rows.push(lines[j].trim()); j++; }
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => inlineMd(c.trim()));
      let html = "<table>";
      if (rows.length >= 2) {
        html += "<thead><tr>" + cells(rows[0]).map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
        for (const r of rows.slice(2)) html += "<tr>" + cells(r).map((c) => `<td>${c}</td>`).join("") + "</tr>";
        html += "</tbody>";
      } else for (const r of rows) html += "<tr>" + cells(r).map((c) => `<td>${c}</td>`).join("") + "</tr>";
      out.push(html + "</table>");
      i = j - 1;
      continue;
    }
    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushAll(); const l = h[1].length; out.push(`<h${l} class="md-h">${inlineMd(h[2])}</h${l}>`); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushAll(); out.push("<hr>"); continue; }
    if (t.startsWith("&gt;")) { flushAll(); out.push(`<blockquote class="md-q">${inlineMd(t.replace(/^&gt;\s?/, ""))}</blockquote>`); continue; }
    const ul = t.match(/^[-*]\s+(.*)$/);
    if (ul) { flushPara(); if (list !== "ul") { flushList(); out.push('<ul class="md-list">'); list = "ul"; } out.push(`<li>${inlineMd(ul[1])}</li>`); continue; }
    const ol = t.match(/^\d+[.)]\s+(.*)$/);
    if (ol) { flushPara(); if (list !== "ol") { flushList(); out.push('<ol class="md-list">'); list = "ol"; } out.push(`<li>${inlineMd(ol[1])}</li>`); continue; }
    flushList();
    para.push(t);
  }
  flushAll();
  return out.join("");
}

// 摘要行用的纯文本化：去 markdown 记号
function stripMd(s) {
  return String(s ?? "")
    .replace(/```[\s\S]*?(?:```|$)/g, " [代码] ")
    .replace(/`([^`]*)`/g, "$1")
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/[*_~#>|]+/g, " ")
    .replace(/^\s*&gt;/gm, "")
    .replace(/\s+/g, " ")
    .trim();
}

// ---------- 工具函数 ----------
function msgTime(m) { return m?.timestamp ? new Date(m.timestamp).toLocaleTimeString("zh-CN", { hour12: false }) : ""; }
// 消息 content 可能是块数组（assistant/user）或纯字符串（system）——统一归一化为块数组
function asBlocks(content) {
  if (Array.isArray(content)) return content;
  if (typeof content === "string" && content.trim()) return [{ type: "text", text: content }];
  return [];
}
function textBlocks(content) { return asBlocks(content).filter((b) => b.type === "text").map((b) => b.text).join("").trim(); }
function hasToolCall(entry) {
  return (entry.model ?? []).some((m) => Array.isArray(m.content) && m.content.some((b) => b.type === "toolCall"));
}
function isFinalAnswer(entry) {
  if (entry.kind !== "pi.assistant") return false;
  const m = entry.model?.[0];
  return m && !hasToolCall(entry) && textBlocks(m.content);
}
function flatText(entry) {
  let out = "";
  for (const m of entry.model ?? []) {
    for (const b of asBlocks(m.content)) out += " " + (b.text ?? b.thinking ?? (b.type === "toolCall" ? JSON.stringify(b.arguments ?? {}) : ""));
  }
  if (entry.data != null) out += " " + JSON.stringify(entry.data);
  return out;
}

// ---------- run 分组 ----------
// 一轮 run = 一条 pi.user 输入带来的所有条目，直到下一条 pi.user 或上下文边界。
// 前一条目不是"最终回答"（还在工具轮中）的 pi.user 视为 steer（转向/追加指令）。
function groupRuns(entries) {
  const groups = [];
  let current = null;
  let lastFinal = true;
  for (const e of entries) {
    if (e.head != null) { current = null; groups.push({ type: "epoch", entry: e }); continue; }
    if (e.kind === "pi.user") {
      const steer = !lastFinal;
      current = { type: "run", steer, firstId: e.id, time: msgTime(e.model?.[0]), entries: [e] };
      groups.push(current);
      lastFinal = false;
      continue;
    }
    if (!current) { current = { type: "run", steer: false, firstId: e.id, time: "", entries: [e] }; groups.push(current); }
    else current.entries.push(e);
    if (isFinalAnswer(e)) lastFinal = true;
  }
  for (const g of groups) {
    if (g.type !== "run") continue;
    const promptEntry = g.entries.find((e) => e.kind === "pi.user");
    g.prompt = promptEntry ? textBlocks(promptEntry.model?.[0]?.content) : "(无用户输入)";
    const final = [...g.entries].reverse().find(isFinalAnswer);
    g.answer = final ? textBlocks(final.model?.[0]?.content) : "";
    g.turns = g.entries.filter((e) => e.kind === "pi.assistant").length;
    g.tools = g.entries.filter((e) => e.kind === "pi.tool-result").length;
  }
  return groups;
}

// ---------- 工具卡片：call 与 result 配对 ----------
function toolCardHtml(call, resultEntry, liveTool) {
  const status = resultEntry ? (resultEntry.model?.[0]?.isError ? "err" : "ok") : liveTool ? (liveTool.status === "running" ? "running" : "") : "";
  const label = { err: "❌ 出错", ok: "✅ 完成", running: "⏳ 运行中", "": "· 等待" }[status];
  const dur = resultEntry?.model?.[0]?.durationMs;
  const argObj = call.arguments ?? {};
  const args = JSON.stringify(argObj);
  let body = `<details><summary>参数</summary><pre class="code">${esc(args.length > 800 ? args.slice(0, 800) + "…" : args)}</pre></details>`;
  if ((call.name === "write" || call.name === "edit") && typeof argObj.path === "string" && argObj.path.trim()) {
    body += `<div class="muted">📄 <a class="filelink" href="${toFileHref(argObj.path)}" target="_blank" rel="noopener noreferrer">在新窗口打开 ${esc(argObj.path)}</a></div>`;
  }
  const output = resultEntry
    ? asBlocks(resultEntry.model?.[0]?.content).map((b) => (b.type === "text" ? b.text : "")).join("\n")
    : liveTool?.output ?? "";
  if (output) body += `<pre class="code">${esc(output.length > 2000 ? "…\n" + output.slice(-2000) : output)}</pre>`;
  const diag = resultEntry?.data?.diagnostics ?? liveTool?.diagnostics ?? [];
  for (const d of diag) if (d.message) body += `<div class="muted">⚠ ${esc(d.message)}</div>`;
  return `<div class="tool-card ${status}"><details open>
    <summary class="tc-head"><span class="tc-name">🛠 ${esc(call.name)}</span><span class="tc-status">${label}${dur != null ? ` · ${dur}ms` : ""}</span></summary>
    <div class="tc-body">${body}</div></details></div>`;
}

// ---------- 条目渲染（run 展开后）----------
function entryHtml(e, resultIndex, liveToolByCall) {
  if (e.kind === "pi.user") {
    return `<div class="msg user"><div class="bubble">${linkifyFiles(esc(textBlocks(e.model?.[0]?.content)))}</div><button class="fork-btn" data-fork="${esc(e.id)}" title="从此提问分叉新会话（上下文复制到此处，可换指令重试）">⑂</button></div>`;
  }
  if (e.kind === "pi.system") {
    return `<details class="syschip"><summary>⚙ 系统提示变更（${esc(Object.keys(e.model?.[0]?.sections ?? {}).join(", ") || "—")}）</summary><pre class="code">${esc(JSON.stringify(e.model?.[0]?.sections ?? e.model?.[0]?.content ?? {}, null, 1).slice(0, 1200))}</pre></details>`;
  }
  if (e.kind === "pi.tool-result") {
    const tr = e.model?.[0];
    if (tr?.toolCallId && resultIndex.has(tr.toolCallId)) return ""; // 已并入工具卡片
    const out = asBlocks(tr?.content).map((b) => (b.type === "text" ? b.text : "")).join("\n");
    return `<div class="tool-card ${tr?.isError ? "err" : "ok"}"><details open><summary class="tc-head"><span class="tc-name">🛠 ${esc(tr?.toolName ?? "?")}</span><span class="tc-status">${tr?.isError ? "❌ 出错" : "✅ 完成"}</span></summary><div class="tc-body"><pre class="code">${esc(out)}</pre></div></details></div>`;
  }
  if (e.kind === "pi.assistant") {
    const parts = [];
    for (const m of e.model ?? []) {
      for (const b of asBlocks(m.content)) {
        if (b.type === "text" && b.text?.trim()) parts.push(`<div class="e-body md">${mdToHtml(b.text)}</div>`);
        else if (b.type === "thinking" && b.thinking?.trim()) parts.push(`<details><summary>💭 思考过程</summary><div class="e-body thinking quoted">${esc(b.thinking)}</div></details>`);
        else if (b.type === "toolCall") parts.push(toolCardHtml(b, resultIndex.get(b.id), liveToolByCall.get(b.id)));
      }
    }
    return `<div class="msg agent"><div class="bubble">${parts.join("") || '<span class="muted">（无内容）</span>'}</div></div>`;
  }
  return `<div class="msg agent"><div class="bubble muted">${esc(e.kind)}：<pre class="code">${esc(JSON.stringify(e.data ?? e.model ?? {}, null, 1).slice(0, 800))}</pre></div></div>`;
}

// ---------- 主渲染 ----------
// ---------- 增量渲染（#27 P1）：entry HTML 缓存 + run 级 DOM 复用 ----------
// committed entry 不可变：无未配对 toolCall 的条目渲染一次后缓存；
// 流式期间只重建末 run 的 body 与侧栏，历史 run 的 DOM 稳定不动。
const runEls = new Map();   // key → { el, sig, open, hay, runNo }
const entryCache = new Map(); // entryId → html（缓存上限保护，结构性重置时消亡）

function allCallsResolved(entry, resultIndex) {
  for (const m of entry.model ?? []) {
    for (const b of asBlocks(m.content)) {
      if (b.type === "toolCall" && !resultIndex.has(b.id)) return false;
    }
  }
  return true;
}

function liveTailHtml(ctx) {
  let body = "";
  const gen = ctx.live.generation;
  if (gen?.message?.content) {
    const parts = [];
    for (const b of asBlocks(gen.message.content)) {
      if (b.type === "text" && b.text) parts.push(`<div class="e-body md">${mdToHtml(b.text)}</div>`);
      else if (b.type === "thinking" && b.thinking) parts.push(`<div class="e-body thinking quoted">${esc(b.thinking)}</div>`);
    }
    if (parts.length) body += `<div class="msg agent stream"><div class="bubble">${parts.join("")}<div class="muted">✍ 生成中（第 ${gen.attempt + 1} 次）${gen.retry ? ` · 重试: ${esc(gen.retry.error)}` : ""}</div></div></div>`;
  }
  for (const t of ctx.live.tools ?? []) {
    if (ctx.resultIndex.has(t.callId)) continue;
    body += toolCardHtml({ name: t.name, id: t.callId, arguments: t.details?.arguments ?? {} }, null, t);
  }
  return body;
}

function entryHtmlCached(e, ctx) {
  const id = String(e.id);
  const cacheable = e.kind !== "pi.assistant" || allCallsResolved(e, ctx.resultIndex);
  if (cacheable) {
    const hit = entryCache.get(id);
    if (hit !== undefined) return hit;
  }
  const html = entryHtml(e, ctx.resultIndex, ctx.liveToolByCall);
  if (cacheable) {
    if (entryCache.size > 4000) entryCache.clear(); // 结构重置后的冷缓存兑底
    entryCache.set(id, html);
  }
  return html;
}

function runBodyHtml(g, ctx, isLastRun) {
  let html = "";
  for (const e of g.entries) html += entryHtmlCached(e, ctx);
  if (isLastRun && ctx.busy) html += liveTailHtml(ctx);
  return html;
}

function runHeadHtml(g, runNo, isOpen, busy) {
  const promptText = stripMd(g.prompt);
  const answerText = stripMd(g.answer);
  const preview = g.answer
    ? `<b>${esc(promptText)}</b> → ${esc(answerText.length > 70 ? answerText.slice(0, 70) + "…" : answerText)}`
    : `<b>${esc(promptText)}</b>${busy ? " <span class='muted'>（进行中…）</span>" : ""}`;
  const stats = [`${g.turns} 轮响应`, g.tools ? `${g.tools} 次工具` : null, g.time].filter(Boolean).join(" · ");
  return `<div class="run-head" data-first="${String(g.firstId)}">
      <span class="run-no">#${runNo}</span>
      <span class="run-tag ${g.steer ? "steer" : "new"}">${g.steer ? "转向" : "新输入"}</span>
      <span class="run-preview">${preview}</span>
      <span class="run-stats">${stats}</span>
      <span class="run-caret">${isOpen ? "▾" : "▸"}</span>
    </div>`;
}

function render(view) {
  const live = view.docs?.["pi.live"] ?? {};
  const busy = Boolean(live.run);
  const st = $("status");
  st.textContent = busy ? "运行中" : "空闲";
  st.className = "badge " + (busy ? "busy" : "idle");
  $("btnAbort").disabled = !busy;
  // 同步输入区状态胶囊与发送按钮文案（忙时发送变为“排队”）
  const cstate = $("cstate");
  cstate.className = "state " + (busy ? "busy" : "idle");
  $("cstateText").textContent = busy ? "运行中" : "空闲";
  $("btnSendLabel").textContent = busy ? "排队" : "发送";
  $("btnSend").title = busy ? "正在运行：发送将自动排队为 follow-up" : "发送（忙时自动排队为 follow-up）";

  const agent = view.docs?.["pi.agent"] ?? {};
  const modelSel = $("modelSel");
  if (agent.model) {
    const pid = agent.model.provider ?? "";
    const id = agent.model.modelId ?? "";
    const opt = [...modelSel.options].find((o) => o.value === id && (o.dataset.provider ?? "") === pid);
    if (modelSel.dataset.loaded === "1" && !modelSel.matches(":focus") && opt) modelSel.value = id;
    modelSel.dataset.known = id;
  }
  $("cwd").textContent = agent.cwd ?? "";

  const entries = (view.entries ?? []).filter((e) => e.kind !== "head");
  const resultIndex = new Map();
  for (const e of entries) {
    if (e.kind === "pi.tool-result") {
      const tr = e.model?.[0];
      if (tr?.toolCallId) resultIndex.set(tr.toolCallId, e);
    }
  }
  const liveToolByCall = new Map((live.tools ?? []).map((t) => [t.callId, t]));
  const ctx = { live, busy, resultIndex, liveToolByCall };

  const groups = groupRuns(entries);
  const q = $("search").value.trim().toLowerCase();

  // 最后一轮（或新出现的轮次）自动展开
  if (groups.length) {
    const lastRun = [...groups].reverse().find((g) => g.type === "run");
    const lastFirst = lastRun ? String(lastRun.firstId) : "";
    if (lastFirst && $("transcript").dataset.lastFirst !== lastFirst) {
      expanded.add(lastFirst);
      $("transcript").dataset.lastFirst = lastFirst;
    }
  }

  const t = $("transcript");
  const nearBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 160;

  if (!groups.length) {
    runEls.clear();
    t.innerHTML = `<div class="muted">（无匹配内容）</div>`;
  } else {
    let runNo = 0;
    const desiredOrder = [];
    let anyVisible = false;
    for (const g of groups) {
      const isLast = g === groups[groups.length - 1];
      if (g.type === "epoch") {
        const key = `epoch:${g.entry.id}`;
        desiredOrder.push(key);
        anyVisible = true; // epoch 恒可见，不应触发"无匹配"占位
        if (!runEls.has(key)) {
          const label = g.entry.kind === "pi.reset" ? "上下文重置" : "上下文压缩";
          const summary = textBlocks(g.entry.model?.[0]?.content);
          const el = document.createElement("div");
          el.dataset.key = key;
          el.innerHTML = `<div class="epoch">── ${label} ──</div>` + (summary ? `<div class="quoted muted md">${mdToHtml(summary)}</div>` : "");
          runEls.set(key, { el, sig: "epoch" });
        }
        continue;
      }
      runNo++;
      const key = String(g.firstId);
      desiredOrder.push(key);
      const isOpen = q ? true : expanded.has(key);
      const sig = [runNo, g.entries.length, g.turns, g.tools, g.answer ? 1 : 0, isOpen ? 1 : 0, isLast && busy ? 1 : 0].join(":");
      let rec = runEls.get(key);
      if (!rec) {
        const el = document.createElement("div");
        el.className = "run";
        el.dataset.key = key;
        rec = { el, sig: "" };
        runEls.set(key, rec);
      }
      if (rec.sig !== sig) {
        const isLastRun = g === [...groups].reverse().find((x) => x.type === "run");
        rec.el.className = `run ${isOpen ? "open" : ""}`;
        rec.el.innerHTML = runHeadHtml(g, runNo, isOpen, busy) + (isOpen ? `<div class="run-body">${runBodyHtml(g, ctx, isLastRun)}</div>` : "");
        rec.sig = sig;
        rec.hay = (g.prompt + " " + g.entries.map(flatText).join(" ")).toLowerCase();
      }
      // 搜索/过滤：只切 display，不重建
      const visible = (!q || (rec.hay ?? "").includes(q)) && !((filterMode === "tools" && g.tools === 0) || (filterMode === "steer" && !g.steer));
      rec.el.style.display = visible ? "" : "none";
      if (visible) anyVisible = true;
    }
    // 结构对账：删失效 + 校准顺序（仅结构变化时发生 DOM 移动）
    const wanted = new Set(desiredOrder);
    for (const [key, rec] of [...runEls]) {
      if (!wanted.has(key)) { rec.el.remove(); runEls.delete(key); }
    }
    const domKeys = Array.from(t.children).map((el) => el.dataset.key).filter(Boolean);
    if (domKeys.join("\u0001") !== desiredOrder.join("\u0001")) {
      for (const key of desiredOrder) t.appendChild(runEls.get(key).el);
    }
    const noMatch = t.querySelector("[data-nomatch]");
    if (!anyVisible && groups.length > 0) {
      if (!noMatch) {
        const d = document.createElement("div");
        d.className = "muted";
        d.dataset.nomatch = "1";
        d.textContent = "（无匹配内容）";
        t.appendChild(d);
      }
    } else noMatch?.remove();
  }

  if (nearBottom || followBottom) t.scrollTop = t.scrollHeight; // 内容更新时视图跟随（用户上翻阅读时不拉拽）
  maybeRefreshTasks(); // 任务图面板打开时随渲染节流刷新（内部再限 3s）
  maybeRefreshFiles();

  // 侧栏：实时运行
  const lp = $("livePanel");
  const gen = live.generation;
  if (busy || (live.tools ?? []).length || live.compactions?.length) {
    lp.style.display = "";
    let html = "";
    if (gen) {

}

// pi-durable 会话层不做展开，host UI 端代劳，命令模板本身仍来自 pi 的 prompts 目录。
let customCommands = [];

function parseCommandArgs(s) {
  const args = []; let cur = "", q = null;
  for (const ch of s) {
    if (q) { if (ch === q) q = null; else cur += ch; }
    else if (ch === '"' || ch === "'") q = ch;

}
function substituteArgs(content, args) {
  const all = args.join(" ");

    if (defT) { const v = defT === "@" || defT === "ARGUMENTS" ? all : args[parseInt(defT, 10) - 1]; return v || defV; }
    if (slStart) { let start = parseInt(slStart, 10) - 1; if (start < 0) start = 0; if (slLen) return args.slice(start, start + parseInt(slLen, 10)).join(" "); return args.slice(start).join(" "); }
    if (simple === "ARGUMENTS" || simple === "@") return all;
    return args[parseInt(simple, 10) - 1] ?? "";

const fuzzy = (q, s) => {
  q = q.toLowerCase(); s = s.toLowerCase();

  for (const ch of s) { if (ch === q[i]) i++; if (i >= q.length) return true; }
  return false;
};
function paletteContext() {
  const pos = inputEl.selectionStart ?? 0;
  const before = inputEl.value.slice(0, pos);
  const nl = before.indexOf("\n");
  const line1 = nl === -1 ? before : before.slice(0, nl);
  if (line1.startsWith("/") && !line1.slice(1).includes(" ")) return { mode: "cmd", start: 0, end: pos, token: line1.slice(1) };
  const at = before.lastIndexOf("@");
  if (at >= 0 && (at === 0 || /\s/.test(before[at - 1]))) {
    const token = before.slice(at + 1);
    if (!/\s/.test(token)) return { mode: "file", start: at, end: pos, token };
  }

}
async function refreshPalette() {
  const ctx = composing ? null : paletteContext();
  if (!ctx) { closePalette(); return; }
  if (!pal || pal.mode !== ctx.mode || pal.start !== ctx.start) pal = { ...ctx, items: [], active: 0 };
  else Object.assign(pal, { end: ctx.end, token: ctx.token });
  if (ctx.mode === "cmd") {
    const entries = [
      ...HOST_COMMANDS.map((c) => ({ kind: "host", cmd: c, name: c.name, title: "/" + c.name, desc: c.desc + (c.arg ? " " + c.arg : "") })),
      ...customCommands.map((c) => ({ kind: "custom", name: c.name, title: "/" + c.name, desc: (c.description || "pi 自定义命令") + (c.argumentHint ? " " + c.argumentHint : "") })),
    ].filter((c) => fuzzy(ctx.token, c.name));
    entries.sort((a, b) => (a.name.startsWith(ctx.token) ? 0 : 1) - (b.name.startsWith(ctx.token) ? 0 : 1));
    pal.items = entries.slice(0, 8);
  } else {
    if (!filesCache.at || Date.now() - filesCache.at > 30000) {
      pal.items = [{ kind: "loading", title: "加载文件列表…", desc: "" }];
      renderPalette();
      try { filesCache = { at: Date.now(), files: (await api("/api/files")).files ?? [] }; } catch { filesCache = { at: Date.now(), files: [] }; }
      if (!pal) return; // 异步期间已关闭
    }
    const hits = filesCache.files.filter((f) => fuzzy(ctx.token, f.path));
    hits.sort((a, b) => {
      const rank = (f) => { const base = f.path.split("/").pop().toLowerCase(); const t = ctx.token.toLowerCase(); return t && base.startsWith(t) ? 0 : base.includes(t) ? 1 : 2; };
      return rank(a) - rank(b);

  }

}

    const caret = start + it.path.length + 2;
    inputEl.setSelectionRange(caret, caret);
    inputEl.dispatchEvent(new Event("input"));

  }
  if (it.kind === "host" && !it.cmd?.arg) {

    try { await it.cmd.exec(""); } catch (err) { toast("命令失败：" + err.message); }

  const name = $("sessionSel").value;
  if (name === "default") { toast("default 会话不可删除"); return; }
  if (!confirm(`删除会话 ${name}？（conversation 数据仍在存储中，仅解除映射）`)) return;
  try { await api("/api/sessions", { method: "POST", body: JSON.stringify({ action: "delete", name }) }); toast(`已删除 ${name}`); }
  catch (err) { toast(err.message); }
};

async function loadModels() {
  try {
    const { source, default: def, providers } = await api("/api/models");
    const sel = $("modelSel");
    const provs = providers?.length ? providers : [{ id: def.provider, kind: "credential", models: [] }];
    const kindLabel = { custom: "自定义", credential: "凭证" };
    sel.innerHTML = provs.map((p) => {
      const opts = p.models.map((m) => {
        const bits = [m.name && m.name !== m.id ? m.name : m.id];
        if (m.contextWindow) bits.push(`${Math.round(m.contextWindow / 1000)}k`);
        if (m.reasoning) bits.push("推理");
        const cur = p.id === def.provider && m.id === def.modelId;
        return `<option value="${esc(m.id)}" data-provider="${esc(p.id)}"${cur ? " selected" : ""}>${esc(bits.join(" · "))}</option>`;
      }).join("");
      return `<optgroup label="${esc(p.id)}（${kindLabel[p.kind] ?? p.kind}）">${opts}</optgroup>`;
    }).join("");
    sel.dataset.provider = def.provider;
    sel.title = source;
    if (sel.dataset.known) sel.value = sel.dataset.known;
    sel.dataset.loaded = "1";
  } catch {}
}
$("modelSel").onchange = async () => {
  const sel = $("modelSel");
  const provider = sel.selectedOptions[0]?.dataset.provider || sel.dataset.provider;
  try { await api("/api/config", { method: "POST", body: JSON.stringify({ model: { provider, modelId: sel.value } }) }); toast(`模型已切换：${provider}/${sel.value}（当前会话持久生效）`); }
  catch (err) { toast("切换失败：" + err.message); loadModels(); }
};

let approvalsHtml = "";
async function refreshApprovals() {
  try {
    const { approved, pending } = await api("/api/approvals");
    const panel = $("approvalPanel");
    if (!pending.length && !approved.length) { panel.style.display = "none"; approvalsHtml = ""; return; }
    let html = "";
    for (const item of pending) {
      html += `<div class="kv"><b>⛔ ${esc(item.why ?? "危险命令")}</b> · ${esc(item.blockedAt ?? "")}
        <pre class="code">${esc(item.command)}</pre>
        <button class="mini primary" data-approve="${esc(item.command)}">批准</button><button class="mini" data-dismiss="${esc(item.command)}">忽略</button></div>`;
    }
    for (const [i, item] of approved.entries()) {
      html += `<div class="kv">✅ <code class="md-inline">${esc(item.command)}</code> <button class="mini danger" data-revoke="${i + 1}">撤销</button></div>`;
    }
    if (html === approvalsHtml) return;
    approvalsHtml = html;
    panel.style.display = "";
    $("approvalBody").innerHTML = html;
  } catch {}
}
$("approvalBody").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  try {
    if (btn.dataset.approve) { await api("/api/approve", { method: "POST", body: JSON.stringify({ command: btn.dataset.approve }) }); toast("已批准，可让 agent 重试原命令"); }
    else if (btn.dataset.dismiss) { await api("/api/approvals/dismiss", { method: "POST", body: JSON.stringify({ command: btn.dataset.dismiss }) }); }
    else if (btn.dataset.revoke) { await api("/api/approve/revoke", { method: "POST", body: JSON.stringify({ index: +btn.dataset.revoke }) }); }
    approvalsHtml = ""; await refreshApprovals();
  } catch (err) { toast(err.message); }
});
setInterval(refreshApprovals, 5000);
refreshApprovals(); loadSessions(); loadModels(); loadCommands();

$("btnBackup").onclick = async () => {
  try { const { file } = await api("/api/backup", { method: "POST", body: "{}" }); toast("已备份：" + file); }
  catch (err) { toast(err.message); }
};
$("btnRestart").onclick = async () => {
  if (!confirm("热重启 daemon？运行中的 run 会由后继进程 resume 接续，SSE 自动重连。")) return;
  $("conn").textContent = "重启中…";
  try { await api("/api/restart", { method: "POST", body: "{}" }); }
  catch (err) { toast("重启请求失败：" + err.message); }
  // EventSource 自动重连到新 daemon；收到 view 事件后 conn 恢复"已连接"
};

// ---------- 连接 ----------
let renderTimer = null;
let renderPendingOnVisible = false;
function scheduleRender(view) {
  lastView = view;
  if (renderTimer) return; // rAF 对齐帧率；后台标签页跳帧，回前台补一次
  renderTimer = requestAnimationFrame(() => {
    renderTimer = null;
    if (document.hidden) { renderPendingOnVisible = true; return; }
    try { render(lastView); }
    catch (err) {
      console.error("[ui] render 失败:", err);
      toast("UI 渲染出错：" + err.message + "（详情见控制台；刷新页面可恢复）");
    }
  });
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && renderPendingOnVisible) { renderPendingOnVisible = false; if (lastView) render(lastView); }
});
// ---------- 连接（SSE v2：view 快照 + entries/live/docs 增量帧，见 issue #27） ----------
const UI_PROTO = 2; // 与 lib/server.js 的 SERVER_PROTO 对应
let uiView = null;
function applyEvent(name, data) {
  try {
    if (name === "view") {
      uiView = data;
      entryCache.clear(); // 结构性重置：旧缓存可能携带过时的 call/result 配对
    }
    else if (!uiView) return;
    else if (name === "entries") {
      const list = uiView.entries ?? (uiView.entries = []);
      for (const e of data.entries ?? []) if (!list.length || list[list.length - 1].id !== e.id) list.push(e);
    } else if (name === "live") {
      uiView.docs = { ...(uiView.docs ?? {}), "pi.live": data.live };
    } else if (name === "docs") {
      uiView.docs = { ...(uiView.docs ?? {}), ...data.docs };
    }
    $("conn").textContent = "已连接";
    scheduleRender(uiView);
  } catch (err) {
    // 异常可见化（issue #33）：渲染链路出错时上报，而不是静默冻结
    console.error("[ui] applyEvent " + name + " 失败:", err);
    toast("UI 处理 " + name + " 事件出错：" + err.message + "（详情见控制台）");
  }
}
function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("session", (ev) => { renderSessions(JSON.parse(ev.data)); });
  for (const name of ["view", "entries", "live", "docs"]) es.addEventListener(name, (ev) => applyEvent(name, JSON.parse(ev.data)));
  es.onerror = () => { $("conn").textContent = "重连中…"; };
}
connect();
